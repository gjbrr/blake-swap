[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blake-swap"
version = "0.2.0"
description = "BTC <-> BLAKE atomic swap reference implementation"
readme = "README.md"
license = { file = "LICENSE" }
# coincurve 21.0.0 cannot build on Python 3.14 (its hatch build fails on
# cffi's licence metadata), so the supported range is stated rather than
# implied. See blake-swap-correctness-review.md, NEW-5.
requires-python = ">=3.12,<3.14"
dependencies = [
    "coincurve==21.0.0",
    "websockets==17.1",
]

[project.scripts]
blake-swap-engine = "swap_v2:main"
blake-swap-agent = "swap_agent:main"

[project.optional-dependencies]
# Only needed for the encrypted coordination mode
# (BLAKE_SWAP_NOSTR_ENCRYPTION=nip44_v2). Plaintext coordination, the
# default, does not import it.
crypto = ["cryptography==50.0.1"]
# Test-only tooling. `tests/packaging_tests.py` parses the CI workflow, and
# a check that skips without its parser is exactly the vacuous pass it
# exists to prevent.
dev = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/gjbrr/blake-swap"

# The Python engine modules are installable and expose console entry points.
# The richer scripts/blake operator wrapper remains checkout-oriented for now.
#
# Coverage configuration deliberately lives only in .coveragerc, which
# scripts/coverage.sh points coverage at explicitly. Two sources of truth
# for a coverage configuration is how a threshold ends up measuring the
# wrong thing.
[tool.setuptools]
py-modules = [
    "blake_web_ui",
    "fee_policy",
    "nip44",
    "swap_agent",
    "swap_timeout_policy",
    "swap_v2",
    "swap_wire",
]

[tool.setuptools.package-dir]
"" = "src"
